// ===== 웹 버전 어댑터: 서버 없이 브라우저의 File System Access API로 같은 API를 흉내 낸다 (Chrome·Edge 데스크톱) =====
const WEB=(()=>{

const CATS={"이미지":".jpg .jpeg .png .gif .heic .webp .bmp .tiff .raw .cr2 .nef .svg","영상":".mp4 .mov .mkv .avi .wmv .webm .m4v","오디오":".mp3 .m4a .wav .flac .aac .ogg","문서":".pdf .doc .docx .hwp .hwpx .txt .md .rtf .pages .key .ppt .pptx .odt","표·데이터":".xls .xlsx .csv .numbers .json .xml .sqlite .db","압축":".zip .7z .rar .tar .gz .tgz .bz2 .xz","설치·디스크":".dmg .pkg .iso .exe .msi .apk","코드":".py .js .ts .html .css .sh .ipynb .java .c .cpp .go .rs"};

const need=()=>{if(!R)throw E("먼저 [폴더 선택]으로 작업할 폴더를 고르세요");return R};

  H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}

   for(;i+64<=u.length;i+=64)blk(u,i);while(i<u.length)buf[bl++]=u[i++]},
  hex(){const bits=tl*8,pad=new Uint8Array(((bl<56)?56-bl:120-bl)+8);pad[0]=0x80;const hi=Math.floor(bits/4294967296),lo=bits>>>0,n=pad.length;

   const keep=tl;this.update(pad);tl=keep;return[...H].map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}}}
async function hashBlob(f,limit){const s=Sha();if(limit){s.update(new Uint8Array(await f.slice(0,limit).arrayBuffer()))}else{const r=f.stream().getReader();for(;;){const{done,value}=await r.read();if(done)break;s.update(value)}}return s.hex()}
// ---- 디렉터리 순회 ----
async function* walk(dirH,base,o){for await(const[name,h]of dirH.entries()){if(SKIP.has(name)||(!o.hidden&&name.startsWith(".")))continue;const p=base?base+"/"+name:name;

const ent=async e=>{const f=await e.h.getFile();return{...e,f,size:f.size,mtime:Math.floor(f.lastModified/1000)}};
const fmt=e=>({path:full(e.p),size:e.size,mtime:e.mtime});
async function dirAt(parts,create){let h=R.h;for(const n of parts){h=await h.getDirectoryHandle(n,{create:!!create})}return h}
async function exists(rel){const parts=rel.split("/").filter(Boolean),name=parts.pop();try{const d=await dirAt(parts);try{await d.getFileHandle(name);return true}catch(e){try{await d.getDirectoryHandle(name);return true}catch(e2){return false}}}catch(e){return false}}
async function unique(rel,taken){const i=rel.lastIndexOf("/"),dir=i<0?"":rel.slice(0,i+1),n=rel.slice(i+1),x=n.lastIndexOf("."),stem=x>0?n.slice(0,x):n,sx=x>0?n.slice(x):"";let c=rel,k=2;while((taken&&taken.has(c))||await exists(c))c=dir+`${stem} (${k++})${sx}`;return c}
// ---- 스캔 ----
async function scanDup(a){need();const min=Math.max(1,+a.min_size||1),refs=(a.refs||[]).filter(Boolean).map(toRel);const by=new Map();
 for await(const e of walk(R.h,"",{hidden:a.hidden,skip:a.dev?null:DEV})){if(e.dir)continue;const x=await ent(e);if(x.size<min)continue;(by.get(x.size)||by.set(x.size,[]).get(x.size)).push(x)}
 const groups=[];for(const[size,items]of by){if(items.length<2)continue;const part=new Map();for(const x of items){try{const k=await hashBlob(x.f,65536);(part.get(k)||part.set(k,[]).get(k)).push(x)}catch(e){}}
  for(const cand of part.values()){if(cand.length<2)continue;const fl=new Map();for(const x of cand){try{const k=await hashBlob(x.f);(fl.get(k)||fl.set(k,[]).get(k)).push(x)}catch(e){}}
   for(const[h,g]of fl){if(g.length>1){g.sort((a,b)=>a.p<b.p?-1:1);groups.push({hash:h.slice(0,12),size,files:g.map(x=>({...fmt(x),ref:refs.some(r=>x.p===r||x.p.startsWith(r+"/"))})),wasted:size*(g.length-1)})}}}}
 groups.sort((a,b)=>b.wasted-a.wasted);return{groups:groups.slice(0,500),total_groups:groups.length,wasted:groups.reduce((s,g)=>s+g.wasted,0)}}
async function scanBig(a){need();const out=[];for await(const e of walk(R.h,"",{hidden:a.hidden,skip:a.dev?null:DEV})){if(!e.dir)out.push(fmt(await ent(e)))}out.sort((a,b)=>b.size-a.size);return{files:out.slice(0,+a.limit||200)}}
async function scanEmpty(a){need();const dev=!!a.dev;let zero=[];for await(const e of walk(R.h,"",{hidden:a.hidden})){if(!e.dir){const x=await ent(e);if(x.size===0)zero.push(x)}}
 const empty=new Set(),projects=new Set();
 async function chk(dh,p){let em=true;for await(const[n,h]of dh.entries()){if(SKIP.has(n))continue;if(h.kind==="file"){em=false;continue}
   if(PKG.has(ext(n))){em=false;continue}if(!await chk(h,p?p+"/"+n:n))em=false}
  if(em&&p)empty.add(p);return em}
 // .git 존재 여부는 하위 순회 전에 알 수 있도록 먼저 한 번 훑는다
 async function marks(dh,p){for await(const[n,h]of dh.entries()){if(h.kind!=="directory"||SKIP.has(n)||PKG.has(ext(n)))continue;const q=p?p+"/"+n:n;if(n===".git")projects.add(p);else await marks(h,q)}}
 await marks(R.h,"");await chk(R.h,"");
 const inDev=p=>p.split("/").some(x=>DEV.has(x))||[...projects].some(pr=>pr!==""&&(p===pr||p.startsWith(pr+"/")));
 let dirs=[...empty].sort().filter(p=>{const i=p.lastIndexOf("/");return i<0||!empty.has(p.slice(0,i))});
 let skipped=0;const objs=[];for(const p of dirs){let h=await dirAt(p.split("/"));objs.push({path:full(p),size:0,mtime:0,_p:p})}
 let zs=zero.map(x=>({...fmt(x),_p:x.p}));
 if(!dev){const n=objs.length+zs.length;const d2=objs.filter(o=>!inDev(o._p)),z2=zs.filter(o=>!inDev(o._p)&&!KEEP.has(o._p.split("/").pop()));skipped=n-d2.length-z2.length;return{zero:z2,dirs:d2,skipped}}

async function planOrg(a){need();const mode=a.mode||"type",plan=[],taken=new Set();const ents=[];for await(const[n,h]of R.h.entries())if(h.kind==="file")ents.push([n,h]);ents.sort((a,b)=>a[0]<b[0]?-1:1);

  const sub={type:cat,month,"type-month":cat+"/"+month}[mode];const dst=await unique(sub+"/"+n,taken);taken.add(dst);plan.push({src:full(n),dst:full(dst),size:f.size})}return{plan}}
async function planRename(a){need();const tpl=a.template||"{name}",find=a.find||"",repl=a.repl||"",start=+a.start||1,pad=+a.pad||2;const names=[];for await(const[n,h]of R.h.entries())if(h.kind==="file"&&!n.startsWith("."))names.push([n,h]);names.sort((a,b)=>a[0]<b[0]?-1:1);

 for(let i=0;i<list.length;i++){const[n,h]=list[i],x=n.lastIndexOf("."),stem0=x>0?n.slice(0,x):n,sx=x>0?n.slice(x):"",stem=find?stem0.split(find).join(repl):stem0,d=new Date((await h.getFile()).lastModified);
  let nw=tpl.split("{name}").join(stem).split("{ext}").join(sx.replace(".","")).split("{n}").join(String(start+i).padStart(pad,"0")).split("{date}").join(d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"));
  if(!tpl.includes("{ext}"))nw+=sx;if(a.case==="lower")nw=nw.toLowerCase();else if(a.case==="upper")nw=nw.toUpperCase();if(a.nfc)nw=nfc(nw);nw=[...nw].map(c=>'/\\:*?"<>|'.includes(c)?"_":c).join("").trim();
  const conflict=nw===""||nw.startsWith(".")||targets.has(nw)||(nw!==n&&exist.has(nfc(nw))&&nfc(nw)!==nfc(n));targets.add(nw);plan.push({src:full(n),dst:full(nw),old:n,new:nw,same:nw===n,conflict:!!conflict})}return{plan}}
// ---- 이동 (move() 우선, 안 되면 복사 후 삭제) ----
async function cloneDirs(src,dst){for await(const[n,c]of src.entries()){if(c.kind==="directory")await cloneDirs(c,await dst.getDirectoryHandle(n,{create:true}))}}
async function moveRel(src,dst){const sp=src.split("/"),sn=sp.pop(),dp=dst.split("/"),dn=dp.pop(),sd=await dirAt(sp),dd=await dirAt(dp,true);let h,isDir=false;
 try{h=await sd.getFileHandle(sn)}catch(e){h=await sd.getDirectoryHandle(sn);isDir=true}
 if(typeof h.move==="function"){try{if(sd===dd||await sd.isSameEntry(dd))await h.move(dn);else await h.move(dd,dn);return}catch(e){}}

const JK="fm_web_journal";
const jload=()=>{try{return JSON.parse(localStorage.getItem(JK)||"[]")}catch(e){return[]}};
const jsave=j=>{try{localStorage.setItem(JK,JSON.stringify(j.slice(-100)))}catch(e){}};
function log(label,ops,errs){let entry=null;if(ops.length){entry={id:Date.now(),label,at:new Date().toLocaleString("sv-SE").slice(0,19),root:R.name,ops,undone:false};const j=jload();j.push(entry);jsave(j)}return{done:ops.length,errors:errs,entry}}
async function hasFiles(h){for await(const[n,c]of h.entries()){if(SKIP.has(n))continue;if(c.kind==="file")return true;if(await hasFiles(c))return true}return false}
async function trash(a){need();const ops=[],errs=[];let freed=0;for(const raw of a.paths){try{const rel=toRel(raw);if(!rel)throw E("루트 폴더 자체는 대상이 될 수 없습니다");if(rel.split("/").includes(TRASH))throw E("휴지통 안입니다");
  const parts=rel.split("/"),n=parts.pop(),pd=await dirAt(parts);let size=0,h;try{h=await pd.getFileHandle(n);size=(await h.getFile()).size}catch(e){h=await pd.getDirectoryHandle(n).catch(()=>{throw E("대상이 없습니다")});if(await hasFiles(h))throw E("파일이 들어 있는 폴더는 휴지통으로 보내지 않습니다")}
  const dst=await unique(TRASH+"/"+n);await moveRel(rel,dst);ops.push({src:rel,dst});freed+=size}catch(e){errs.push({path:raw,error:e.message})}}
 const r=log("휴지통",ops,errs);r.freed=freed;return r}
async function move(a){need();const ops=[],errs=[];for(const m of a.moves){try{const s=toRel(m.src),d=toRel(m.dst);if(!await exists(s))throw E("원본이 없습니다");if(s===d)continue;if(await exists(d)&&nfc(s)!==nfc(d))throw E("대상 이름이 이미 있습니다");await moveRel(s,d);ops.push({src:s,dst:d})}catch(e){errs.push({path:m.src,error:e.message})}}return log(a.label||"이동",ops,errs)}
async function undo(a){need();const j=jload(),en=[...j].reverse().find(e=>!e.undone&&(a.id==null||e.id===a.id));if(!en)throw E("되돌릴 기록이 없습니다");if(en.root!==R.name)throw E(`'${en.root}' 폴더를 다시 선택한 뒤 되돌리세요`);
 let ok=0;const errs=[];for(const op of [...en.ops].reverse()){try{if(!await exists(op.dst))throw E("이미 옮겨졌거나 사라짐");if(await exists(op.src))throw E("원래 위치에 같은 이름이 있음");await moveRel(op.dst,op.src);ok++}catch(e){errs.push({path:op.dst,error:e.message})}}
 if(ok){en.undone=true;jsave(j)}return{restored:ok,errors:errs}}
async function dirSize(h){let s=0;for await(const[n,c]of h.entries()){s+=c.kind==="file"?(await c.getFile()).size:await dirSize(c)}return s}
async function disk(){need();let t=0;try{t=await dirSize(await R.h.getDirectoryHandle(TRASH))}catch(e){}return{total:null,free:null,trash:t,mode:"web"}}
async function trashEmpty(){need();let n=0,freed=0;try{const t=await R.h.getDirectoryHandle(TRASH);for await(const[nm,c]of t.entries()){freed+=c.kind==="file"?(await c.getFile()).size:await dirSize(c);await t.removeEntry(nm,{recursive:true});n++}}catch(e){}return{removed:n,freed}}
const API={dup:scanDup,big:scanBig,empty:scanEmpty,org:planOrg,rename:planRename,trash,move,undo,disk,trash_empty:trashEmpty};
return{
 supported:()=>!!window.showDirectoryPicker,
 setRoot(h,name){R={h,name:name||h.name}},
 async pick(){const h=await window.showDirectoryPicker({mode:"readwrite"});R={h,name:h.name};return"/"+h.name},
 rootPath:()=>R?"/"+R.name:"",
 call:async(n,b)=>{const f=API[n];if(!f)throw new Error("지원하지 않는 기능: "+n);return f(b||{})},
 journal:()=>({journal:jload().reverse()}),
 _sha:hashBlob};
})();
</script>
<script>
const TOKEN="__TOKEN__",HOME="__HOME__",_R='__ROOTS__';
const WEBMODE=TOKEN==="__TOK"+"EN__";  // 서버가 값을 채우지 않았으면(GitHub Pages 등 정적 호스팅) 브라우저 전용 웹 모드
const ROOTS=WEBMODE?[]:JSON.parse(_R);
const baseOf=p=>ROOTS.find(r=>p===r.path||p.startsWith(r.path.replace(/\/$/,"")+"/"))||ROOTS[0];
const norm=p=>p.trim().replace(/\\/g,"/");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB";
const fmtDate=t=>new Date(t*1000).toLocaleDateString("ko-KR");
const rel=p=>{const r=$("#root").value.replace(/\/$/,"");return p.startsWith(r+"/")?p.slice(r.length+1):p};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}
async function api(name,body){
  if(WEBMODE)return WEB.call(name,body);
  const r=await fetch("/api/"+name,{method:"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const root=()=>{if(WEBMODE){const v=WEB.rootPath();if(!v)throw new Error("먼저 [폴더 선택]으로 작업할 폴더를 고르세요");return v}const v=norm($("#root").value);if(!v)throw new Error("폴더 경로를 입력하세요");return v};
$("#root").value=WEBMODE?"":localStorage.getItem("fm_root")||(ROOTS.length>1?ROOTS[1].path+"/Download":HOME+"/Downloads");
$("#root").onchange=()=>localStorage.setItem("fm_root",$("#root").value);

// 폴더 선택기: Finder 컬럼 보기 (사이드바 · 뒤로/앞으로 · 열 · 경로 막대)
const PK={cols:[],hist:[],hi:-1,side:[],base:ROOTS[0]};
const closePk=()=>{$("#pkbg").hidden=true};
const lsDirs=async p=>{const j=await (await fetch("/api/ls?path="+encodeURIComponent(p))).json();if(j.error)throw new Error(j.error);return j.dirs};
const pkPath=()=>{const c=PK.cols.filter(c=>c.sel!=null);return c.length?PK.cols[c.length-1].path+"/"+PK.cols[c.length-1].sel:PK.cols[0].path};
async function pkOpen(target){ // target 경로까지 열(column)을 펼친다
  const base=PK.base=baseOf(target);
  const rel=target.startsWith(base.path)?target.slice(base.path.length).split("/").filter(Boolean):[];
  const cols=[{path:base.path,dirs:await lsDirs(base.path),sel:null}];
  for(const part of rel){const last=cols[cols.length-1];if(!last.dirs.includes(part))break;last.sel=part;const p=last.path+"/"+part;cols.push({path:p,dirs:await lsDirs(p),sel:null})}
  PK.cols=cols;pkDraw(true)}
async function pkPush(target){if(PK.hist[PK.hi]!==target){PK.hist=PK.hist.slice(0,PK.hi+1);PK.hist.push(target);PK.hi=PK.hist.length-1}await pkOpen(target)}
function pkDraw(scroll){
  const cur=pkPath(),name=cur.split("/").pop()||"/";
  const B=PK.base.path,sideItems=[...ROOTS.map(r=>[r.name,r.path]),...PK.side];
  const crumbs=cur.slice(B.length).split("/").filter(Boolean);
  $("#pk").innerHTML=`<div class="tb"><button id="pkb" ${PK.hi>0?"":"disabled"}>‹</button><button id="pkf" ${PK.hi<PK.hist.length-1?"":"disabled"}>›</button><b>📁 ${esc(name)}</b></div>
  <div class="mid"><div class="side"><h6>즐겨찾기</h6>${sideItems.map(([l,p])=>`<div data-s="${esc(p)}" class="${cur===p||cur.startsWith(p+"/")&&!ROOTS.some(r=>r.path===p)?"on":""}">${ROOTS.some(r=>r.path===p)?"🏠":"📁"} ${esc(l)}</div>`).join("")}</div>
  <div class="cols">${PK.cols.map((c,i)=>`<div class="col ${i<PK.cols.length-1?"":"last"}" data-i="${i}">`+(c.dirs.length?c.dirs.map(d=>`<div data-d="${esc(d)}" class="${c.sel===d?"sel2":""}"><span>📁</span><span class="n">${esc(d)}</span><i>›</i></div>`).join(""):`<div class="mu" style="display:block">하위 폴더 없음</div>`)+`</div>`).join("")}</div></div>
  <div class="bar"><span data-c="">🏠 ${esc(PK.base.name)}</span>${crumbs.map((c,i)=>` › <span data-c="${esc(crumbs.slice(0,i+1).join("/"))}">📁 ${esc(c)}</span>`).join("")}</div>
  <div class="ft"><button id="pkc">취소</button><button class="pri" id="pks">선택</button></div>`;
  const cols=$("#pk .cols");document.querySelectorAll("#pk .col").forEach((el,i)=>{if(i<PK.cols.length-1)el.classList.add("dim")});
  if(scroll){cols.scrollLeft=cols.scrollWidth;const s=document.querySelector("#pk .col .sel2");document.querySelectorAll("#pk .col").forEach(c=>{const x=c.querySelector(".sel2");if(x)c.scrollTop=Math.max(0,x.offsetTop-80)})}}
$("#pk").addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#pkb")){PK.hi--;await pkOpen(PK.hist[PK.hi])}
  else if(t.closest("#pkf")){PK.hi++;await pkOpen(PK.hist[PK.hi])}
  else if(t.closest("#pkc"))closePk();
  else if(t.closest("#pks")){$("#root").value=pkPath();$("#root").onchange();closePk()}
  else if(t.closest("[data-s]"))pkPush(t.closest("[data-s]").dataset.s);
  else if(t.closest("[data-c]"))pkPush(PK.base.path+(t.closest("[data-c]").dataset.c?"/"+t.closest("[data-c]").dataset.c:""));
  else if(t.closest("[data-d]")){const col=t.closest(".col"),i=+col.dataset.i,d=t.closest("[data-d]").dataset.d;
    try{const c=PK.cols[i],p=c.path+"/"+d;const dirs=await lsDirs(p);c.sel=d;PK.cols=PK.cols.slice(0,i+1);PK.cols.push({path:p,dirs,sel:null});
      PK.hist=PK.hist.slice(0,PK.hi+1);PK.hist.push(p);PK.hi=PK.hist.length-1;pkDraw(true)}catch(x){toast(x.message)}}});
$("#pk").addEventListener("dblclick",e=>{if(e.target.closest("[data-d]"))$("#pks").click()});
$("#browse").onclick=async()=>{if(WEBMODE){try{$("#root").value=await WEB.pick();toast("선택한 폴더 안에서만 동작합니다");diskInfo()}catch(e){if(e.name!=="AbortError")toast(e.message)}return}try{
  if(!PK.side.length){const L={Desktop:"데스크탑",Documents:"문서",Downloads:"다운로드",Download:"다운로드",Pictures:"사진",DCIM:"카메라(DCIM)",Movies:"영화",Videos:"동영상",Music:"음악"};
    for(const r of ROOTS){const d=await lsDirs(r.path);for(const n of Object.keys(L))if(d.includes(n))PK.side.push([L[n],r.path+"/"+n])}}
  $("#pkbg").hidden=false;const v=norm($("#root").value);PK.hist=[];PK.hi=-1;await pkPush(ROOTS.some(r=>v===r.path||v.startsWith(r.path+"/"))?v:ROOTS[0].path)}catch(e){toast(e.message);closePk()}};
$("#pkbg").addEventListener("mousedown",e=>{if(e.target.id==="pkbg")closePk()});
document.addEventListener("keydown",e=>{if($("#pkbg").hidden)return;if(e.key==="Escape")closePk();if(e.key==="Enter")$("#pks").click()});

// 탭
let TRASH_MODE="";
async function diskInfoWeb(){TRASH_MODE="web";try{const d=await api("disk");$("#disk").innerHTML=`🌐 웹 버전 · 휴지통 = 선택한 폴더 안 <b>.FileManager-Trash</b> (<b>${fmtSize(d.trash)}</b>) <button id="empty" style="font-size:12px;padding:1px 8px">휴지통 비우기</button>`;$("#empty").onclick=async()=>{if(!confirm("휴지통을 비웁니다. 비운 파일은 복구할 수 없습니다. 계속할까요?"))return;try{const r=await api("trash_empty");toast(`${fmtSize(r.freed)} 확보 (${r.removed}개 영구 삭제)`);diskInfo()}catch(e){fail(e)}}}catch(e){$("#disk").innerHTML="🌐 웹 버전 — <b>[폴더 선택]</b>으로 시작하세요. 선택한 폴더 안에서만 동작합니다. <span class=\"mu\">(브라우저가 다운로드·문서·바탕화면 폴더 자체는 막을 수 있어, 그 안의 하위 폴더를 고르세요)</span>"}}
async function diskInfo(){if(WEBMODE)return diskInfoWeb();try{const d=await api("disk");TRASH_MODE=d.mode;const app=d.mode==="app";
  $("#disk").innerHTML=`💾 여유 공간 <b>${fmtSize(d.free)}</b> / ${fmtSize(d.total)}`+(app?` · 앱 휴지통 <b>${fmtSize(d.trash)}</b> <button id="empty" style="font-size:12px;padding:1px 8px">휴지통 비우기</button>`:` · 이 앱이 보낸 휴지통 <b>${fmtSize(d.trash)}</b> <span class="mu">(휴지통을 비우면 이만큼 확보)</span>`);
  if(app)$("#empty").onclick=async()=>{if(!confirm("앱 휴지통을 비웁니다. 비운 파일은 복구할 수 없습니다. 계속할까요?"))return;try{const r=await api("trash_empty");toast(`${fmtSize(r.freed)} 확보 (${r.removed}개 영구 삭제)`);diskInfo()}catch(e){fail(e)}}}catch(e){}}
diskInfo();
if(!WEBMODE){setInterval(()=>fetch("/api/ping").catch(()=>{}),5000);fetch("/api/ping").catch(()=>{})}
$("#quit").onclick=async()=>{if(!confirm("파일 관리 앱을 종료합니다. (작업 기록은 보관됩니다)"))return;try{await api("quit")}catch(e){}document.body.innerHTML='<p style="padding:30px">종료되었습니다. 이 탭을 닫아도 됩니다.</p>'};
const TABS=[["dup","중복 파일"],["big","큰 파일"],["empty","빈 항목"],["org","자동 정리"],["rename","이름 바꾸기"],["log","기록·되돌리기"]];
$("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
$("#tabs").onclick=e=>{const k=e.target.dataset.t;if(k)go(k)};
function go(k){localStorage.setItem("fm_tab",k);document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===k));V[k]()}
const view=h=>{$("#view").innerHTML=h};
const busy=m=>view(`<div class="card">${m}…</div>`);
const fail=e=>{toast(e.message);return e};

// 선택·휴지통 공통
function selBar(){return `<div class="row"><button id="all">전체 선택</button><button id="none">해제</button><span id="cnt" class="mu"></span><span style="flex:1"></span><button id="do" class="dng" disabled>선택 항목 휴지통으로</button></div>`}
function wireSel(afterTrash,guard){
  const upd=()=>{const c=[...document.querySelectorAll(".sel:checked")];const sz=c.reduce((a,x)=>a+ +x.dataset.s,0);$("#cnt").textContent=c.length?`${c.length}개 · ${fmtSize(sz)}`:"";$("#do").disabled=!c.length};
  $("#view").onchange=e=>{if(e.target.classList.contains("sel"))upd()};
  $("#all").onclick=()=>{document.querySelectorAll(".sel:not(:disabled)").forEach(x=>x.checked=true);upd()};
  $("#none").onclick=()=>{document.querySelectorAll(".sel").forEach(x=>x.checked=false);upd()};
  $("#do").onclick=async()=>{if(guard&&!guard())return;const ps=[...document.querySelectorAll(".sel:checked")].map(x=>x.dataset.p);
    if(!confirm(`${ps.length}개를 휴지통으로 보냅니다. (기록 탭에서 되돌릴 수 있음)`))return;
    try{const r=await api("trash",{paths:ps});toast(`휴지통 ${r.done}개 · ${fmtSize(r.freed)} 정리`+(r.errors.length?` · 실패 ${r.errors.length}: ${r.errors[0].error}`:"")+(TRASH_MODE==="app"?" — 위의 [휴지통 비우기]를 누르면 여유 공간이 늘어납니다":" — 휴지통을 비우면 여유 공간이 늘어납니다"));diskInfo();afterTrash()}catch(e){fail(e)}};
  upd()}

const V={};
// 중복
V.dup=()=>{view(`<div class="card"><div class="row"><label>최소 크기 <select id="ms"><option value="1">전체</option><option value="102400">100KB</option><option value="1048576" selected>1MB</option><option value="10485760">10MB</option></select></label>
 <label><input type="checkbox" id="hid"> 숨김 포함</label>
 <label><input type="checkbox" id="dev"> 개발 폴더(venv·node_modules·.git) 포함 <span class="warn">(권장 안 함)</span></label></div>
 <div class="row"><input id="refs" style="flex:1" placeholder="기준(보존) 폴더 — 쉼표로 여러 개. 이 안의 파일은 선택할 수 없고 항상 남습니다"></div>
 <button class="pri" id="go">중복 찾기</button> <span class="mu">내용(SHA-256)이 같은 파일만 중복으로 판정합니다.</span></div><div id="res"></div>`);
 $("#go").onclick=async()=>{try{busy2("검색 중 (큰 폴더는 시간이 걸립니다)");const refs=$("#refs").value.split(",").map(s=>s.trim()).filter(Boolean);
  const r=await api("dup",{path:root(),min_size:+$("#ms").value,hidden:$("#hid").checked,dev:$("#dev").checked,refs});
  if(!r.groups.length){$("#res").innerHTML=`<div class="card ok">중복이 없습니다.</div>`;return}
  $("#res").innerHTML=`<div class="card"><b>${r.total_groups}그룹</b> · 낭비 공간 <b>${fmtSize(r.wasted)}</b>${r.total_groups>500?" (상위 500그룹 표시)":""}
   <div class="row" style="margin-top:8px">자동 선택: <button id="keepOld">가장 오래된 것만 남기기</button><button id="keepNew">가장 최근 것만 남기기</button><button id="keepShort">경로 짧은 것만 남기기</button></div></div>`+selBar()+
   r.groups.map((g,i)=>`<div class="card"><div class="mu">${fmtSize(g.size)} × ${g.files.length} · 낭비 ${fmtSize(g.wasted)} · #${g.hash}</div><table data-g="${i}">`+
   g.files.map(f=>`<tr><td style="width:24px"><input type="checkbox" class="sel" data-p="${esc(f.path)}" data-s="${f.size}" ${f.ref?"disabled":""}></td><td class="p">${esc(rel(f.path))} ${f.ref?'<span class="tag ref">기준</span>':""}</td><td class="n mu">${fmtDate(f.mtime)}</td></tr>`).join("")+`</table></div>`).join("");
  const auto=cmp=>{r.groups.forEach((g,i)=>{const tb=$(`table[data-g="${i}"]`),rows=[...tb.rows];const refIdx=g.files.findIndex(f=>f.ref);
    let keep=refIdx>=0?refIdx:g.files.map((f,j)=>j).sort((a,b)=>cmp(g.files[a],g.files[b]))[0];
    rows.forEach((tr,j)=>{const c=tr.querySelector(".sel");if(!c.disabled)c.checked=j!==keep})});$("#view").dispatchEvent(new Event("change",{bubbles:true}));document.querySelectorAll(".sel")[0].dispatchEvent(new Event("change",{bubbles:true}))};
  $("#keepOld").onclick=()=>auto((a,b)=>a.mtime-b.mtime);$("#keepNew").onclick=()=>auto((a,b)=>b.mtime-a.mtime);$("#keepShort").onclick=()=>auto((a,b)=>a.path.length-b.path.length);
  wireSel(()=>$("#go").click(),()=>{const bad=[...document.querySelectorAll("table[data-g]")].filter(t=>{const b=[...t.querySelectorAll(".sel")];return b.every(x=>x.checked||x.disabled)&&!b.some(x=>x.disabled)});
    if(bad.length){toast(`${bad.length}개 그룹에서 모든 복사본이 선택됐습니다. 그룹마다 하나는 남겨야 합니다.`);return false}return true});
  $("#all").onclick=()=>auto((a,b)=>a.mtime-b.mtime)}catch(e){fail(e);$("#res").innerHTML=""}}};
const busy2=m=>{$("#res").innerHTML=`<div class="card">${m}…</div>`};
// 큰 파일
V.big=()=>{view(`<div class="card"><div class="row"><label>표시 개수 <select id="lim"><option>50</option><option selected>200</option><option>500</option></select></label><label><input type="checkbox" id="hid"> 숨김 포함</label><label><input type="checkbox" id="dev"> 개발 폴더 포함</label><button class="pri" id="go">큰 파일 찾기</button></div></div><div id="res"></div>`);
 $("#go").onclick=async()=>{try{busy2("검색 중");const r=await api("big",{path:root(),limit:+$("#lim").value,hidden:$("#hid").checked,dev:$("#dev").checked});
  $("#res").innerHTML=selBar()+`<div class="card"><table><tr><th></th><th>경로</th><th>수정일</th><th>크기</th></tr>`+r.files.map(f=>`<tr><td><input type="checkbox" class="sel" data-p="${esc(f.path)}" data-s="${f.size}"></td><td class="p">${esc(rel(f.path))}</td><td class="mu">${fmtDate(f.mtime)}</td><td class="n">${fmtSize(f.size)}</td></tr>`).join("")+`</table></div>`;
  wireSel(()=>$("#go").click())}catch(e){fail(e);$("#res").innerHTML=""}}};
// 빈 항목
V.empty=()=>{view(`<div class="card"><button class="pri" id="go">빈 폴더·0바이트 파일 찾기</button> <label><input type="checkbox" id="dev"> 프로젝트·개발 폴더 안도 포함 <span class="warn">(권장 안 함)</span></label> <span class="mu">.DS_Store만 있는 폴더도 빈 폴더로 봅니다. 폴더는 .DS_Store 외에 내용이 없을 때만 보냅니다.</span></div><div id="res"></div>`);
 $("#go").onclick=async()=>{try{busy2("검색 중");const r=await api("empty",{path:root(),dev:$("#dev").checked});const rows=[...r.dirs.map(d=>["📁",d]),...r.zero.map(d=>["📄",d])];
  if(!rows.length){$("#res").innerHTML=(r.skipped?`<div class="card mu">🛡️ 프로젝트·개발 폴더 안 ${r.skipped}개는 제외했습니다.</div>`:"")+`<div class="card ok">정리할 빈 항목이 없습니다.</div>`;return}
  $("#res").innerHTML=(r.skipped?`<div class="card mu">🛡️ git 프로젝트·venv·node_modules 안의 ${r.skipped}개는 구조상 필요해서 제외했습니다.</div>`:"")+selBar()+`<div class="card"><table>`+rows.map(([i,f])=>`<tr><td><input type="checkbox" class="sel" data-p="${esc(f.path)}" data-s="0"></td><td>${i}</td><td class="p">${esc(rel(f.path))}</td><td class="mu">${fmtDate(f.mtime)}</td></tr>`).join("")+`</table></div>`;
  wireSel(()=>$("#go").click())}catch(e){fail(e);$("#res").innerHTML=""}}};
// 계획 표 공통
function planCard(plan,label){const ok=plan.filter(p=>!p.conflict&&!p.same);
  $("#res").innerHTML=`<div class="card"><b>${ok.length}개</b> 이동 예정${plan.some(p=>p.conflict)?` · <span class="bad">충돌 ${plan.filter(p=>p.conflict).length}개(건너뜀)</span>`:""} <span class="mu">— 적용 전 미리보기입니다. 아무것도 바뀌지 않았습니다.</span>
  <div class="row" style="margin-top:8px"><button class="pri" id="apply" ${ok.length?"":"disabled"}>${label} 적용</button></div>
  <table><tr><th>현재</th><th>→ 변경 후</th></tr>`+plan.map(p=>`<tr class="${p.conflict?"bad":""}"><td class="p">${esc(p.old||rel(p.src))}</td><td class="p">${p.same?'<span class="mu">(변경 없음)</span>':esc(p.new||rel(p.dst))}${p.conflict?" ⚠ 충돌":""}</td></tr>`).join("")+`</table></div>`;
  $("#apply").onclick=async()=>{try{const r=await api("move",{label,moves:ok.map(p=>({src:p.src,dst:p.dst}))});toast(`${r.done}개 완료`+(r.errors.length?` · 실패 ${r.errors.length}: ${r.errors[0].error}`:"")+" · 기록 탭에서 되돌리기");$("#res").innerHTML=`<div class="card ok">${r.done}개 적용됨. 되돌리려면 '기록·되돌리기' 탭.</div>`}catch(e){fail(e)}}}
// 자동 정리
V.org=()=>{view(`<div class="card"><div class="row"><label>분류 방식 <select id="md"><option value="type">종류별 (이미지/문서/…)</option><option value="month">수정 월별 (2026-10)</option><option value="type-month">종류 / 월별</option></select></label><button class="pri" id="go">미리보기</button></div><div class="mu">선택한 폴더 바로 아래의 파일만 하위 폴더로 옮깁니다(하위 폴더·숨김 파일 제외, 같은 이름이 있으면 번호를 붙임).</div></div><div id="res"></div>`);
 $("#go").onclick=async()=>{try{const r=await api("org",{path:root(),mode:$("#md").value});if(!r.plan.length){$("#res").innerHTML=`<div class="card">정리할 파일이 없습니다.</div>`;return}planCard(r.plan,"자동 정리")}catch(e){fail(e)}}};
// 이름 바꾸기
V.rename=()=>{view(`<div class="card"><div class="row"><label>형식 <input id="tpl" value="{name}" size="22"></label><span class="mu">{name} 원래 이름 · {n} 번호 · {date} 수정일 · {ext} 확장자(없으면 자동 유지)</span></div>
 <div class="row"><label>찾기 <input id="find" size="10"></label><label>바꿀 말 <input id="repl" size="10"></label><label>번호 시작 <input id="st" type="number" value="1" style="width:60px"></label><label>자릿수 <input id="pad" type="number" value="2" style="width:50px"></label>
 <label>대소문자 <select id="case"><option value="">유지</option><option value="lower">소문자</option><option value="upper">대문자</option></select></label><label>확장자만 <input id="ext" size="6" placeholder=".jpg"></label>
 <label><input type="checkbox" id="nfc"> 한글 정규화(NFC)</label></div><button class="pri" id="go">미리보기</button></div><div id="res"></div>`);
 $("#go").onclick=async()=>{try{const r=await api("rename",{path:root(),template:$("#tpl").value,find:$("#find").value,repl:$("#repl").value,start:+$("#st").value,pad:+$("#pad").value,case:$("#case").value,ext:$("#ext").value.trim(),nfc:$("#nfc").checked});
  if(!r.plan.length){$("#res").innerHTML=`<div class="card">대상 파일이 없습니다.</div>`;return}planCard(r.plan,"이름 바꾸기")}catch(e){fail(e)}}};
// 기록
V.log=async()=>{try{const j=WEBMODE?WEB.journal():await (await fetch("/api/journal")).json();
 view(`<div class="card">`+(j.journal.length?`<table><tr><th>시각</th><th>작업</th><th>개수</th><th></th></tr>`+j.journal.map(e=>`<tr><td>${e.at}</td><td>${esc(e.label)}</td><td>${e.ops.length}</td><td class="n">${e.undone?'<span class="mu">되돌림</span>':`<button data-u="${e.id}">되돌리기</button>`}</td></tr>`).join("")+`</table><div class="mu" style="margin-top:8px">휴지통으로 보낸 항목은 휴지통에서 원래 위치로 복원됩니다(OS 휴지통의 '되돌려놓기'와는 별개). 휴지통을 이미 비웠다면 복원할 수 없습니다.</div>`:"기록이 없습니다.")+`</div>`);
 $("#view").onclick=async e=>{const id=e.target.dataset.u;if(!id)return;try{const r=await api("undo",{id:+id});diskInfo();toast(`복원 ${r.restored}개`+(r.errors.length?` · 실패 ${r.errors.length}: ${r.errors[0].error}`:""));V.log()}catch(x){fail(x)}}}catch(e){fail(e)}};
if(WEBMODE){$("#quit").hidden=true;$("#root").readOnly=true;$("#root").placeholder="← [폴더 선택]을 눌러 작업할 폴더를 고르세요";$("#browse").textContent="폴더 선택";$("#browse").classList.add("pri");
  if(!WEB.supported())document.querySelector("main").insertAdjacentHTML("beforebegin",`<div class="card" style="margin:14px 16px;border-color:var(--rd)"><b class="bad">이 브라우저는 폴더 접근을 지원하지 않습니다.</b><br>PC의 <b>Chrome 또는 Edge</b>로 이 주소를 다시 열어 주세요. (Firefox·Safari 미지원, 스마트폰은 제한적)</div>`)}
go(localStorage.getItem("fm_tab")||"dup");
</script></body></html>
